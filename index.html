const lineBy=id=>current().lines.find(x=>x.id===id);
const grp=id=>state.groups.find(x=>x.id===id);
const route=id=>grp(id)?.route||(NAMES[id]||state.sections?.some(s=>s.routes.includes(id))?id:'unassigned');
const groupName=id=>grp(id)?.name||NAMES[id]||'مجموعة';
const monthsSorted=()=>state.months.slice().sort((a,b)=>b.id.localeCompare(a.id));
const isLatest=()=>current().id===latest();
const delta=(m,id,extras=[])=>[...m.adjustments,...extras].reduce((acc,a)=>acc+(a.intended===id?-Number(a.amount):0)+(a.actual===id?Number(a.amount):0),0);
const net=(m,l)=>round((Number(l.base)||0)+delta(m,l.id));
const due=(m,routeName)=>m.lines.filter(l=>route(l.stage)===routeName).reduce((v,l)=>v+net(m,l),0);
const total=m=>round(m.lines.reduce((v,l)=>v+net(m,l),0));
const pendingDelta=id=>0; // التوافق مع واجهة الإصدارات السابقة، لا يوجد ترحيل تلقائي
const settleName=id=>id===CURRENT?'الجاري / المتبقي من الراتب':lineBy(id)?.name||state.templates.find(l=>l.id===id)?.name||'بند سابق';

// تهيئة لطيفة للإصدار الجديد بدون مسح بيانات المستخدم السابقة
const DEFAULT_SECTIONS=[
 {id:'ahli',name:'الأهلي',routes:['ahliOwn','ahliPeople']},
 {id:'banks',name:'التحويلات الإجمالية',routes:['rajhi','stc','barq','banksMisc']},
 {id:'auto',name:'الأقساط',routes:['auto']},
 {id:'unassigned',name:'بنود أخرى',routes:['unassigned']}
];
function normalizeState(){
 if(!Array.isArray(state.sections))state.sections=DEFAULT_SECTIONS.map(x=>({...x,routes:[...x.routes]}));
 else {
  for(const sec of DEFAULT_SECTIONS)if(!state.sections.some(x=>x.id===sec.id))state.sections.push({...sec,routes:[...sec.routes]});
  const b=state.sections.find(x=>x.id==='banks');if(b&&!b.routes.includes('banksMisc'))b.routes.push('banksMisc');
 }
 state.groups??=TYPES.map(([id,name])=>({id,name,route:id}));
 state.counterPrefs??={};state.bankExpanded??={rajhi:false,stc:false,barq:false};
 state.bankTargets??={};
 const selected=state.months.find(x=>x.id===latest());
 for(const [bank,targetId,targetName] of [['stc','stc_balance','رصيد'],['barq','barq_home','هوم']]){
  let found=state.templates.find(x=>route(x.stage)===bank&&x.name.trim().toLowerCase()===targetName.toLowerCase()) ||
   state.templates.find(x=>x.id===targetId);
  // بند الربط مخصص للمبلغ الذي يبقى بالحساب بعد التوزيع؛ يبدأ بصفر كي لا يحسب المبلغ مرتين.
  if(!found){found={id:targetId,name:targetName,base:0,stage:bank};state.templates.push({...found});for(const mm of state.months.filter(x=>x.id===latest()))mm.lines.push({...found,done:false,doneAt:null,amountAtDone:null});}
  state.bankTargets[bank]=state.bankTargets[bank]||found.id;
 }
 let investment=state.templates.find(x=>x.id==='investment')||state.templates.find(x=>route(x.stage)==='rajhi'&&/investment|استثمار/i.test(x.name));
 if(!investment){investment={id:'investment',name:'Investment',base:0,stage:'rajhi'};state.templates.push({...investment});for(const mm of state.months.filter(x=>x.id===latest()))mm.lines.push({...investment,done:false,doneAt:null,amountAtDone:null})}
 if(investment&&!state.bankTargets.rajhi)state.bankTargets.rajhi=investment.id;
 // V8: في الإصدار السابق كانت التسويات تبقى معلّقة حتى إنشاء الشهر التالي.
 // نلحق التسويات القديمة بأحدث شهر موجود، مع الاحتفاظ بهوياتها؛ لا نفقدها ولا نكررها.
 if(state.pending?.length){
  const target=state.months.find(x=>x.id===latest());
  if(target){
   const known=new Set(target.adjustments.map(a=>a.id));
   for(const a of state.pending)if(!known.has(a.id)){target.adjustments.push({...a,appliedMonth:target.id});known.add(a.id)}
   state.pending=[];
  }
 }
 for(const mm of state.months){mm.aggregates??={};for(const b of BANKS)mm.aggregates[b]??={done:false,doneAt:null,amountAtDone:null};}
}
normalizeState();
const sectionBy=id=>state.sections.find(x=>x.id===id);
const sectionRoutes=id=>sectionBy(id)?.routes||[];
const sectionTotal=(m,id)=>round(m.lines.filter(l=>sectionRoutes(id).includes(route(l.stage))).reduce((v,l)=>v+net(m,l),0));
const sectionDone=(m,id)=>round(m.lines.filter(l=>l.done&&sectionRoutes(id).includes(route(l.stage))).reduce((v,l)=>v+net(m,l),0));
const completedTotal=m=>round(m.lines.reduce((v,l)=>v+(l.done?net(m,l):0),0));
const progress=(done,total)=> total>0?Math.min(100,Math.max(0,done/total*100)) : 0;
function progressHTML(done,total,small=false){
 const percent=progress(done,total),complete=total>0&&done>=total-0.005;
 return `<div class="completion ${small?'small':''}"><div class="track"><div class="fill ${complete?'complete':'pending'}" style="width:${percent.toFixed(2)}%"></div></div><div class="progressline"><span>تم ${fmt(done)}</span><span>${Math.round(percent)}٪</span></div></div>`;
}
let sectionAddOpen=false,sectionDirectAdd=null;

let inline=null, quickPicker=null, salaryEdit=false, menuOpen=false, lastAdjusted=null, addFor=null, editGroup=null, histItem=null,settleDetails=null,settleDraft=null;
function toast(msg){let n=$('#toast');n.textContent=msg;n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',2500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('تعذّر الحفظ؛ صدّر نسخة احتياطية')}}
function updateMonth(which,scope,fn){const m=current();for(const x of state.months){if(x.id===m.id||(scope==='future'&&x.id>m.id)){const row=x.lines.find(l=>l.id===which);if(row)fn(row)}}if(scope==='future'){const t=state.templates.find(l=>l.id===which);if(t)fn(t)}}
function checked(l,group=false){return `<button class="tick ${l.done?'done':''}" data-act="${group?'tickBank':'tick'}" data-id="${escape(l.id)}" aria-label="${l.done?'إلغاء علامة صح':'وضع علامة صح'}">✓</button>`}
function renderTop(){
 const m=current(),planned=total(m),completed=completedTotal(m),remainder=m.salary?round(m.salary-planned):null;
 const p=m.adjustments.reduce((a,x)=>a+(x.intended===CURRENT?-Number(x.amount):0)+(x.actual===CURRENT?Number(x.amount):0),0);
 $('#monthStrip').innerHTML=monthsSorted().map(x=>`<button class="monthpill ${m.id===x.id?'active':''}" data-act="month" data-id="${escape(x.id)}">${escape(monthName(x.id))}</button>`).join('');
 $('#summary').innerHTML=`<div class="metric"><div class="label">إجمالي التحويلات</div><div class="num">${fmt(planned)}</div>${progressHTML(completed,planned)}</div><button class="metric remain" data-act="salary" aria-label="تعديل الراتب"><div class="label">المتبقي من الراتب ✎</div><div class="num">${remainder===null?'—':fmt(remainder)}</div></button>`;
 $('#salaryInline').innerHTML=salaryEdit?`<div class="salarybox"><div class="tiny">الراتب الشهري (ريال)</div><input id="salaryValue" type="number" inputmode="decimal" step="0.01" min="0" value="${m.salary||''}" placeholder="أدخل الراتب"><div class="scopebar"><button data-act="saveSalary" data-scope="month">هذا الشهر</button><button class="main" data-act="saveSalary" data-scope="future">الحالي والقادم</button><button class="cancel" data-act="closeSalary">إلغاء</button></div>${p?`<div class="tiny">تسويات الجاري لهذا الشهر: ${signed(p)}</div>`:''}</div>`:'';
 $('#menu').classList.toggle('hidden',!menuOpen);$('#moreBtn').setAttribute('aria-expanded',menuOpen?'true':'false');
}

function groupHeader(g,m){
 const a=m.lines.filter(l=>l.stage===g.id),sum=round(a.reduce((v,l)=>v+net(m,l),0));
 return `<div class="subhead" data-grouphead="${escape(g.id)}">${editGroup===g.id?`<input class="ginput" data-id="${escape(g.id)}" value="${escape(g.name)}" maxlength="80" aria-label="اسم المجموعة">`:`<span class="gname tap" data-act="editGroup" data-id="${escape(g.id)}">${escape(g.name)}</span>`}<span class="gsum">${fmt(sum)}</span><button class="gplus" data-act="addLine" data-id="${escape(g.id)}" aria-label="بند جديد تحت ${escape(g.name)}">+</button><button class="gdelete" data-act="deleteGroupAsk" data-id="${escape(g.id)}" aria-label="حذف مجموعة ${escape(g.name)}">×</button></div>`;
}

function historyHTML(id){let arr=monthsSorted().filter(x=>x.id<current().id&&x.lines.some(l=>l.id===id));return `<div class="history">${arr.length?arr.map(m=>{const l=m.lines.find(x=>x.id===id);return `<div class="historyrow"><span>${escape(monthName(m.id))}</span><span>${fmt(net(m,l))} <span class="fade">${l.done?'✓':'—'}</span></span></div>`}).join(''):'لا توجد شهور سابقة لهذا البند.'}</div>`}
function ledgerFor(id){const m=current();const active=[];const applied=m.adjustments.filter(a=>a.intended===id||a.actual===id);return {active,applied}}
function adjSigned(a,id){return a.actual===id?Number(a.amount):-Number(a.amount)}
function counterpart(a,id){return settleName(a.intended===id?a.actual:a.intended)}
function settlementDetailsHTML(id){const {active,applied}=ledgerFor(id);
const rows=(items,type)=>items.map(a=>{let sign=adjSigned(a,id);return `<div class="settle-line"><span class="settle-sign ${sign>=0?'positive':'negative'}">${signed(sign)}</span><span class="settle-other">${escape(counterpart(a,id))}</span>${isLatest()?`<button data-act="editSettlement" data-id="${escape(id)}" data-aid="${escape(a.id)}" aria-label="تعديل التسوية">✎</button>`:''}<button type="button" class="del" data-act="deleteSettlement" data-id="${escape(id)}" data-aid="${escape(a.id)}" aria-label="حذف التسوية مع ${escape(counterpart(a,id))}">×</button></div>`}).join('');
return `<div class="settle-details">${applied.length?`<div class="settle-title" style="margin-top:9px">تسويات ${escape(monthName(current().id))} (${applied.length})</div>${rows(applied,'applied')}`:'<div class="settle-empty">لا توجد تسويات لهذا الشهر</div>'}</div>`}
function renderSettlementEditor(l){if(!settleDraft||settleDraft.lineId!==l.id)return '';
let v=settleDraft;let other=v.other&&v.other!==l.id?v.other:CURRENT;
const options=`<option value="${CURRENT}" ${other===CURRENT?'selected':''}>الجاري / المتبقي من الراتب</option>`+current().lines.filter(x=>x.id!==l.id).map(x=>`<option value="${escape(x.id)}" ${other===x.id?'selected':''}>${escape(x.name)} — ${escape(groupName(x.stage))}</option>`).join('');
return `<div class="settle-editor" data-editor="${escape(l.id)}"><div class="edithead">${v.editId?'تعديل تسوية':'تسوية جديدة'} ${v.sign<0?'− من':' + إلى'} ${escape(l.name)}</div><div class="inputs"><div class="amountfield"><label>المبلغ (ر.س)</label><input id="settleAmount" type="number" min="1" step="1" inputmode="decimal" value="${v.amount}" aria-label="مبلغ التسوية"></div></div><div class="stepper"><button data-act="settleStep" data-step="-100">−100</button><button data-act="settleStep" data-step="100">+100</button><span class="tiny">كل ضغطة 100 ريال</span></div><label style="margin-top:8px">الطرف المقابل</label><select id="settleCounter" aria-label="الحساب المقابل">${options}</select><div class="settle-helper">${v.sign<0?'يُخصم من هذا البند ويُضاف للطرف المقابل.':'يُضاف لهذا البند ويُخصم من الطرف المقابل.'} التسوية تُضاف لهذا الشهر مباشرة، ولا تتكرر في الشهر القادم.</div><div class="footerbuttons"><button data-act="cancelSettlement">إلغاء</button><button class="primary" data-act="saveSettlement" data-id="${escape(l.id)}">${v.editId?'حفظ التعديل':'حفظ التسوية'}</button></div></div>`}
// البند السالب لا يحتاج أن يكون الطرف المقابل لتسويته هو المستفيد من التحويل الفعلي.
// عندما يكون ضمن بنك له حساب استقبال رئيسي، يُعاد المبلغ السالب إلى حساب الاستقبال.
// هذه إرشادات فقط، ولا تغيّر التسويات الأصلية أو الإجماليات أو علامات الصح.
function negativeTransferHint(m,l){
 const amount=net(m,l);
 if(amount>=-0.005)return '';
 const bank=route(l.stage);
 if(!BANKS.includes(bank))return '';
 const targetId=state.bankTargets?.[bank];
 const target=m.lines.find(x=>x.id===targetId&&route(x.stage)===bank);
 if(!target||target.id===l.id)return '';
 return `<div class="transfer-hint" aria-label="التحويل المطلوب من ${escape(l.name)} إلى ${escape(target.name)}"><span class="transfer-icon" aria-hidden="true">↗</span><span>حوّل <strong class="number">${fmt(-amount)}</strong> ريال إلى <strong>${escape(target.name)}</strong></span></div>`;
}
function rowHTML(m,l){let d=delta(m,l.id),val=net(m,l),label=inline?.id===l.id?inline.field:null,scope=inline?.id===l.id&&inline.stage==='scope',ledger=ledgerFor(l.id),count=ledger.applied.length;
return `<div class="item-shell" data-line-id="${escape(l.id)}"><div class="item">${checked(l)}<span class="handle" data-drag="${escape(l.id)}" aria-label="اسحب لترتيب أو نقل البند" title="اسحب لترتيب أو نقل البند">⠿</span>${label==='name'&&inline.stage==='editing'?`<input class="inlineInput nameInput" data-editinput="name" data-id="${escape(l.id)}" maxlength="110" value="${escape(l.name)}">`:`<span class="itemname ${l.done?'isdone':''}" data-act="inline" data-field="name" data-id="${escape(l.id)}" title="تعديل الاسم مباشرة">${escape(l.name)}</span>`}${label==='base'&&inline.stage==='editing'?`<input class="inlineInput amountInput" data-editinput="base" data-id="${escape(l.id)}" type="number" step="0.01" min="0" inputmode="decimal" value="${l.base}">`:`<span class="itemamt" data-act="inline" data-field="base" data-id="${escape(l.id)}" title="تعديل المبلغ مباشرة">${fmt(val)}</span>`}<button class="quick minus" data-act="adjust" data-id="${escape(l.id)}" data-sign="minus" aria-label="تسوية ناقص جديدة">−</button><button class="quick plus" data-act="adjust" data-id="${escape(l.id)}" data-sign="plus" aria-label="تسوية زائد جديدة">+</button><button class="tinyhist" data-act="history" data-id="${escape(l.id)}" aria-label="سجل البند">↶</button></div><div class="rowbelow">${negativeTransferHint(m,l)}${count?`<div class="deltas">${ledger.applied.length?`<button class="delta ${d>0?'positive':d<0?'negative':''}" data-act="settleDetails" data-id="${escape(l.id)}" aria-expanded="${settleDetails===l.id}">${signed(d)} (${ledger.applied.length}) ▾</button>`:''}</div>`:''}${l.done&&l.amountAtDone!=null&&Math.abs(l.amountAtDone-val)>.005?'<div class="delta negative">تغيّر المبلغ بعد ✓</div>':''}${scope?`<div class="editScope"><b>تحفظ التعديل متى؟</b><div class="scopebar"><button data-act="commitEdit" data-scope="month">هذا الشهر فقط</button><button class="main" data-act="commitEdit" data-scope="future">هذا الشهر وما بعده</button><button class="cancel" data-act="cancelEdit">إلغاء</button>${l&&`<button data-act="deleteLine" data-id="${escape(l.id)}">حذف البند</button>`}</div></div>`:''}${settleDraft?.lineId===l.id?renderSettlementEditor(l):''}${settleDetails===l.id?settlementDetailsHTML(l.id):''}${histItem===l.id?historyHTML(l.id):''}</div></div>`}
function addLineHTML(g){return `<div class="inlineadd"><div class="tiny">بند جديد في ${escape(g.name)}</div><div class="fields"><input class="newname" maxlength="110" placeholder="اسم البند" aria-label="اسم البند"><input class="newamt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="المبلغ" aria-label="المبلغ"></div><div class="scopebar"><button data-act="saveNewLine" data-id="${escape(g.id)}" data-scope="month">هذا الشهر</button><button class="main" data-act="saveNewLine" data-id="${escape(g.id)}" data-scope="future">هذا الشهر وما بعده</button><button class="cancel" data-act="cancelAdd">إلغاء</button></div></div>`}
function addGroupHTML(sectionId){
 const s=sectionBy(sectionId);if(!s)return '';
 const options=sectionId==='banks'?`<select class="bankGroupRoute" aria-label="البنك"><option value="rajhi">الراجحي</option><option value="stc">STC</option><option value="barq">برق</option></select>`:'';
 return `<div class="inlineadd"><div class="fields"><input class="newgroupname" maxlength="80" placeholder="اسم المجموعة الجديدة" aria-label="اسم المجموعة">${options}</div><div class="scopebar"><button class="main" data-act="saveNewGroup" data-section="${escape(sectionId)}">حفظ</button><button class="cancel" data-act="cancelAdd">إلغاء</button></div></div>`;
}

function groupBlock(m,g){return `${groupHeader(g,m)}<div class="dropzone" data-dropgroup="${escape(g.id)}">${m.lines.filter(l=>l.stage===g.id).map(l=>rowHTML(m,l)).join('')}${addFor===g.id?addLineHTML(g):''}</div>`}
function routeBlock(m,st){
 const groups=state.groups.filter(g=>g.route===st&&(!g.deletedFrom||m.id<g.deletedFrom)&&!['auto','unassigned','rajhi','stc','barq'].includes(g.id));
 const standalones=m.lines.filter(l=>l.stage===st);
 return standalones.map(l=>rowHTML(m,l)).join('')+groups.map(g=>groupBlock(m,g)).join('');
}

function step(m,sec,inner){
 const planned=sectionTotal(m,sec.id),completed=sectionDone(m,sec.id);
 return `<section class="step" id="step-${escape(sec.id)}"><div class="stephead"><div class="secline"><strong>${escape(sec.name)}</strong><div class="secheadright"><span class="sum">${fmt(planned)}</span><button class="gplus sectionplus" data-act="addGroup" data-section="${escape(sec.id)}" aria-label="مجموعة جديدة تحت ${escape(sec.name)}">+</button></div></div>${progressHTML(completed,planned,true)}</div>${addFor==='group:'+sec.id?addGroupHTML(sec.id):''}${inner}</section>`;
}

function renderBank(m,k){
 const agg=m.aggregates?.[k]||{done:false},opened=!!state.bankExpanded[k];
 const lines=m.lines.filter(l=>route(l.stage)===k), completed=lines.filter(l=>l.done).length;
 const primary=state.groups.find(g=>g.id===k);const label=primary?.name||NAMES[k];
 const body=routeBlock(m,k);
 return `<div class="bankwrap"><div class="bankhead">${checked({id:k,done:agg.done},true)}<button class="banktoggle" data-act="toggleBank" data-id="${escape(k)}" aria-expanded="${opened}" aria-controls="bankpane-${escape(k)}"><strong>${escape(label)}</strong><span class="bankhint">${completed}/${lines.length}</span><span class="arr">‹</span></button><span class="amt">${fmt(due(m,k))}</span><button class="gplus" data-act="addLine" data-id="${escape(k)}" aria-label="بند جديد تحت ${escape(label)}">+</button></div>${opened?`<div class="bankpane" id="bankpane-${escape(k)}"><div class="dropzone" data-dropgroup="${escape(k)}">${body}${addFor===k?addLineHTML({id:k,name:label}):''}</div></div>`:''}</div>`;
}

function renderMain(){
 const m=current();let output='';
 if(state.partialSeed)output+='<div class="info">بعض البنود من الصورة الأصلية غير مكتملة. <button data-act="dismissSeed" style="float:left;background:transparent;color:#dfd3a2;border:0;font-size:18px" aria-label="إخفاء التنبيه">×</button></div>';
 for(const sec of state.sections){
  if(sec.id==='unassigned'&&!m.lines.some(l=>sectionRoutes(sec.id).includes(route(l.stage)))&& !state.groups.some(g=>sectionRoutes(sec.id).includes(g.route)&&!g.deletedFrom))continue;
  let inside='';
  if(sec.id==='banks')inside=BANKS.map(k=>renderBank(m,k)).join('')+`<div class="dropzone" data-dropgroup="banksMisc">${routeBlock(m,'banksMisc')}${sectionDirectAdd===sec.id?addLineHTML({id:'banksMisc',name:sec.name}):''}</div>`;
  else if(sec.id==='ahli')inside=sec.routes.map(r=>{
    const primary=state.groups.find(g=>g.id===r&&(!g.deletedFrom||m.id<g.deletedFrom));
    const direct=routeBlock(m,r);
    // المجموعات الافتراضية في الأهلي مع زر + لكل واحدة.
    return `${primary?`<div class="subhead" data-grouphead="${escape(r)}">${editGroup===r?`<input class="ginput" data-id="${escape(r)}" value="${escape(primary.name)}" maxlength="80">`:`<span class="gname" data-act="editGroup" data-id="${escape(r)}">${escape(primary.name)}</span>`}<button class="gplus" data-act="addLine" data-id="${escape(r)}">+</button><button class="gdelete" data-act="deleteGroupAsk" data-id="${escape(r)}" aria-label="حذف المجموعة">×</button></div>`:''}<div class="dropzone" data-dropgroup="${escape(r)}">${m.lines.filter(l=>l.stage===r).map(l=>rowHTML(m,l)).join('')}${addFor===r?addLineHTML({id:r,name:primary?.name||r}):''}</div>${state.groups.filter(g=>g.route===r&&g.id!==r&&(!g.deletedFrom||m.id<g.deletedFrom)).map(g=>groupBlock(m,g)).join('')}`;
   }).join('');
  else inside=sec.routes.map(r=>`<div class="dropzone" data-dropgroup="${escape(r)}">${routeBlock(m,r)}${sectionDirectAdd===sec.id?addLineHTML({id:r,name:sec.name}):''}</div>`).join('');
  if(sec.id!=='ahli')inside+=`<div class="directlink"><button data-act="addDirectLine" data-section="${escape(sec.id)}">+ بند مباشر</button></div>`;
  output+=step(m,sec,inside);
 }
 output+=`<div class="addsection">${sectionAddOpen?`<div class="inlineadd"><div class="fields"><input id="newSectionName" maxlength="65" placeholder="اسم القسم الرئيسي" aria-label="اسم القسم الرئيسي"></div><div class="scopebar"><button class="main" data-act="saveSection">حفظ</button><button class="cancel" data-act="cancelSection">إلغاء</button></div></div>`:`<button data-act="addSection">+ قسم رئيسي</button>`}</div>`;
